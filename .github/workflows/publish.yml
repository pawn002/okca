name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    # Release candidates are GitHub prereleases only; they never reach npm.
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx --yes npm@11 publish --access public --provenance
